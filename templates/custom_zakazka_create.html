{% extends 'admin/model/create.html' %}

{% block tail %}
    {{ super() }}
    <!-- Vlastné modálne okno -->
    <div class="modal fade" id="customFirmaModal" tabindex="-1" role="dialog">
      <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title">Nová firma</h4>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
          </div>
          <div class="modal-body" style="padding: 0;">
            <!-- Iframe načíta Flask-Admin formulár bez zbytočného UI -->
            <iframe id="firmaIframe" src="" width="100%" height="450px" frameborder="0"></iframe>
          </div>
        </div>
      </div>
    </div>

    <script>
        $(document).ready(function() {
            // Otvorenie modalu po kliknutí na naše tlačidlo
            $('#btn-nova-firma').on('click', function(e) {
                console.log('0000');
                e.preventDefault();
                // Načítame URL pre vytvorenie firmy do iframe
                $('#firmaIframe').attr('src', '/firma/new/?modal=True');
                $('#customFirmaModal').modal('show');
                console.log('aaa');
            });

            // Keď sa modal zavrie, stiahneme najnovšiu firmu a pridáme ju do roletky
            $('#customFirmaModal').on('hidden.bs.modal', function () {
                $.getJSON('/api/posledna-firma', function(data) {
                    if (data && data.id) {
                        // Vytvoríme novú možnosť a vyberieme ju v Select2 (Flask-Admin roletka)
                        var newOption = new Option(data.nazov, data.id, true, true);
                        $('#klient').append(newOption).trigger('change');
                    }
                });
            });
        });
    </script>
{% endblock %}
